<!DOCTYPE html>
<html lang="pl">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />
  <title>Review · Graphify</title>
  <style>
    :root {
      color-scheme: dark;
      font: 14px system-ui;
      background: #10151e;
      color: #e0e6ef;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
    }
    header {
      padding: 20px 24px;
      border-bottom: 1px solid #303d50;
      display: flex;
      gap: 20px;
      align-items: center;
    }
    h1 {
      font-size: 20px;
      margin: 0;
    }
    small {
      color: #a4b3c8;
    }
    #summary {
      flex: 1;
    }
    input,
    button {
      background: #202c3e;
      color: inherit;
      border: 1px solid #52627a;
      border-radius: 7px;
      padding: 9px;
    }
    input {
      width: 250px;
    }
    button {
      cursor: pointer;
    }
    main {
      display: grid;
      grid-template-columns: minmax(330px, 390px) minmax(0, 1fr);
      height: calc(100vh - 121px);
    }
    aside {
      padding: 18px;
      overflow: auto;
      border-right: 1px solid #303d50;
    }
    #canvas {
      overflow: hidden;
      position: relative;
    }
    #direction-tip {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1;
      max-width: calc(100% - 32px);
      margin: 0;
      padding: 10px 14px;
      border: 1px solid #303d50;
      border-radius: 8px;
      background: #182131;
      color: #c6d4e7;
      font-size: 13px;
      pointer-events: none;
    }
    svg {
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    svg:active {
      cursor: grabbing;
    }
    .legend {
      padding: 10px 24px;
      background: #182131;
      display: flex;
      gap: 22px;
    }
    .changed {
      color: #ffc36e;
    }
    .context {
      color: #8ebcfa;
    }
    .deleted {
      color: #ff8c98;
    }
    #notice {
      white-space: pre-wrap;
      color: #f5c781;
      font-size: 12px;
    }
    h2 {
      font-size: 15px;
    }
    #detail-title {
      overflow-wrap: anywhere;
      color: #7ee2a8;
      font-size: 20px;
      line-height: 1.4;
    }
    .detail-summary, .file-path {
      color: #a4b3c8;
      font-size: 12px;
      line-height: 1.5;
    }
    .detail-summary { margin: 0 0 16px; }
    .connection-group { margin: 22px 0 10px; font-size: 16px; color: #9ac2ff; }
    .connection-card {
      background: #182131;
      border: 1px solid #303d50;
      border-radius: 10px;
      padding: 14px;
      margin: 10px 0;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .connection-file {
      padding: 0;
      border: 0;
      background: none;
      color: #9ac2ff;
      text-align: left;
      font: inherit;
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .connection-file:focus-visible { outline: 2px solid #9ac2ff; outline-offset: 3px; }
    .file-path { display: block; margin: 3px 0 10px; }
    .relation-list { list-style: none; padding: 0; margin: 0 0 12px; }
    .relation-list li { margin: 8px 0; font-size: 14px; color: #edf3fc; }
    .relation-list strong { color: #b8d6ff; font-weight: 600; }
    .connection-card details {
      border-top: 1px solid #303d50;
      padding-top: 10px;
      margin-top: 12px;
      color: #a4b3c8;
      font-size: 12px;
    }
    .connection-card summary { cursor: pointer; }
    pre {
      font-size: 11px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #aebfd7;
    }
    .node {
      cursor: pointer;
    }
    .node rect {
      fill: #1b2b43;
      stroke: #7ba6df;
      stroke-width: 1.6;
    }
    .node.changed rect {
      fill: #3b2d1c;
      stroke: #ffc36e;
      stroke-width: 2.5;
    }
    .node.deleted rect {
      fill: #38202a;
      stroke: #ff8c98;
      stroke-dasharray: 6 4;
    }
    .node.selected rect {
      stroke: white;
      stroke-width: 4;
    }
    .node text {
      fill: #e0e6ef;
      font: 12px ui-monospace, monospace;
    }
    .node .status {
      fill: #b1c1d5;
      font-size: 10px;
    }
    .edge {
      fill: none;
      stroke: #667b99;
      stroke-width: 1.5;
      cursor: pointer;
    }
    .edge.selected {
      stroke: #ffc36e;
      stroke-width: 3;
    }
    .edge-label {
      fill: #bdcce1;
      font: 10px system-ui;
      paint-order: stroke;
      stroke: #10151e;
      stroke-width: 4;
      cursor: pointer;
    }
    .dim {
      opacity: 0.13;
    }
    #empty {
      position: absolute;
      top: 30%;
      left: 15%;
      color: #a4b3c8;
    }
    a {
      color: #9ac2ff;
    }
  </style>
  <header>
    <div>
      <h1>Review <small>× Graphify</small></h1>
      <small id="root"></small>
    </div>
    <div id="summary">Oczekiwanie na analizę…</div>
    <input
      id="search"
      placeholder="Filtruj ścieżki plików"
      aria-label="Filtruj pliki"
    /><button id="fit">Dopasuj</button>
  </header>
  <div class="legend">
    <span class="changed">● Zmienione</span
    ><span class="context">● Bez zmian · bezpośredni sąsiedzi</span
    ><span class="deleted">┄ Usunięte / stara nazwa</span
    ><small
      >Kółko myszy: zoom · przeciąganie:
      przesuwanie</small
    >
  </div>
  <main>
    <aside>
      <div id="notice"></div>
      <h2 id="detail-title">Powiązania</h2>
      <div id="detail">
        Kliknij plik lub strzałkę na grafie, aby poznać jego połączenia.
      </div>
    </aside>
    <div id="canvas">
      <p id="direction-tip"><strong>A → B</strong> oznacza, że A wykorzystuje B</p>
      <svg id="svg" aria-label="Graf plików">
        <defs>
          <marker
            id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto-start-reverse"
          >
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#8ca5c8" />
          </marker>
        </defs>
        <g id="scene"></g>
      </svg>
      <div id="empty"></div>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id),
      ns = "http://www.w3.org/2000/svg";
    let graph = null,
      revision = -1,
      selected = null,
      box = null,
      extent = null,
      drag = null,
      positions = new Map(),
      terminalSelection = null,
      appliedSelection = -1;
    function el(tag, attrs = {}, content) {
      const n = document.createElementNS(ns, tag);
      for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
      if (content !== undefined) n.textContent = content;
      return n;
    }
    function status(n) {
      const s = n.status;
      if (!s) return "bez zmian";
      const a = [];
      if (s.staged) a.push("staged");
      if (s.unstaged) a.push("unstaged");
      if (s.untracked) a.push("untracked");
      if (s.deleted) a.push("usunięty / stara nazwa");
      if (!n.in_graph) a.push("brak w grafie Graphify");
      return `${s.xy} · ${a.join(" · ")}`;
    }
    function kinds(e) {
      return [
        ...new Set(
          e.evidence.map(
            (x) => x.relation || x.relationship || x.type || "relacja bez opisu"
          )
        ),
      ].join(", ");
    }
    function html(tag, className, content) {
      const node = document.createElement(tag);
      node.className = className;
      if (content !== undefined) node.textContent = content;
      return node;
    }
    function relationKind(item) {
      return String(item.relation || item.relationship || item.type || "").trim().toLowerCase();
    }
    function relationVerb(kind) {
      const descriptions = {
        imports: "importuje plik",
        imports_from: "importuje elementy z pliku",
        calls: "wywołuje kod z pliku",
        indirect_call: "pośrednio wywołuje kod z pliku",
        inherits: "dziedziczy po elementach z pliku",
        inherits_from: "dziedziczy po elementach z pliku",
        extends: "rozszerza elementy z pliku",
        implements: "implementuje interfejs z pliku",
        uses: "korzysta z elementów pliku",
        depends_on: "zależy od pliku",
        contains: "zawiera elementy z pliku",
        includes: "dołącza plik",
        re_exports: "udostępnia dalej elementy z pliku",
        references: "odwołuje się do elementów pliku",
        tests: "testuje kod z pliku",
      };
      return Object.hasOwn(descriptions, kind) ? descriptions[kind] : null;
    }
    function relationSentence(kind, source, target) {
      const sentence = html("li", "");
      const verb = relationVerb(kind);
      sentence.append(html("strong", "", source),
        html("span", "", ` ${verb || "ma powiązanie z plikiem"} `),
        html("strong", "", target), html("span", "", "."));
      return sentence;
    }
    function evidence(edges, focus = selected) {
      const detail = $("detail");
      detail.replaceChildren();
      if (!edges.length) {
        detail.textContent = focus
          ? "Graphify nie znalazł połączeń tego pliku z innymi plikami w bieżącej analizie."
          : "Kliknij plik lub strzałkę na grafie, aby poznać jego połączenia.";
        return;
      }
      const neighbors = new Set(edges.flatMap(e => [e.source, e.target]).filter(id => id !== focus));
      detail.append(html("p", "detail-summary", focus
        ? `Połączone pliki: ${neighbors.size}. Każdy opis mówi, co jeden plik robi z kodem drugiego.`
        : "Poniżej przeczytasz, jak te pliki są ze sobą powiązane."));
      const focusName = focus && focus.split("/").pop();
      const groups = focus ? [
        {title: `Co robi ${focusName}`, edges: edges.filter(e => e.source === focus)},
        {title: `Jak inne pliki korzystają z ${focusName}`, edges: edges.filter(e => e.target === focus)},
      ] : [{title: "Połączenie między plikami", edges}];
      for (const group of groups) {
        if (!group.edges.length) continue;
        detail.append(html("h3", "connection-group", `${group.title} (${group.edges.length})`));
        for (const e of group.edges) {
          const card = html("article", "connection-card");
          const sameName = e.source.split("/").pop() === e.target.split("/").pop();
          const sourceName = sameName ? e.source : e.source.split("/").pop();
          const targetName = sameName ? e.target : e.target.split("/").pop();
          const list = html("ul", "relation-list");
          const relations = new Set(e.evidence.map(relationKind));
          for (const kind of relations) {
            list.append(relationSentence(kind, sourceName, targetName));
          }
          card.append(list);
          // Always show full paths, including when two files have the same name.
          const endpoints = focus ? [e.source === focus ? e.target : e.source] : [e.source, e.target];
          for (const [index, id] of endpoints.entries()) {
            if (!focus) card.append(html("small", "file-path", index ? "Do pliku" : "Z pliku"));
            const button = html("button", "connection-file", id.split("/").pop());
            button.type = "button";
            button.title = id;
            button.onclick = () => select(id);
            card.append(button, html("span", "file-path", id));
          }
          const details = html("details", "");
          details.append(html("summary", "", "Dane techniczne Graphify"),
            html("pre", "", JSON.stringify(e.evidence, null, 2)));
          card.append(details);
          detail.append(card);
        }
      }
    }
    function select(id) {
      selected = id;
      $("detail-title").textContent = id || "Powiązania";
      evidence(graph.edges.filter((e) => e.source === id || e.target === id));
      draw();
    }
    function followTerminalSelection(force = false) {
      if (!graph || !terminalSelection ||
          (!force && terminalSelection.revision === appliedSelection)) return;
      appliedSelection = terminalSelection.revision;
      const id = terminalSelection.path;
      if (id && !graph.nodes.some(n => n.id === id)) {
        select(null);
        $("detail-title").textContent = id;
        $("detail").textContent = "Pliku nie ma w bieżącym grafie. Naciśnij r w terminalu, aby odświeżyć analizę.";
        return;
      }
      select(id);
      const position = positions.get(id);
      if (!position) return;
      const w = $("svg").clientWidth, h = $("svg").clientHeight;
      if (!w || !h) return;
      const width = Math.max(600, w), height = width * h / w;
      box = [position[0] + 190 - width / 2,
             position[1] + 38 - height / 2, width, height];
      view();
    }
    function view() {
      if (box) $("svg").setAttribute("viewBox", box.join(" "));
    }
    function fit() {
      if (!extent) return;
      const w = $("svg").clientWidth,
        h = $("svg").clientHeight,
        scale = Math.max(extent[2] / w, extent[3] / h);
      box = [-30, -30, w * scale + 60, h * scale + 60];
      view();
    }
    function draw() {
      if (!graph) return;
      const query = $("search").value.toLowerCase(),
        all = graph.nodes,
        match = new Set(
          all.filter((n) => n.id.toLowerCase().includes(query)).map((n) => n.id)
        );
      const edges = graph.edges.filter(
        (e) => match.has(e.source) || match.has(e.target) ||
               e.source === selected || e.target === selected
      );
      const visible = new Set(match);
      if (selected) visible.add(selected);
      edges.forEach((e) => {
        visible.add(e.source);
        visible.add(e.target);
      });
      const nodes = all.filter((n) => visible.has(n.id));
      const changed = nodes.filter((n) => n.changed),
        context = nodes.filter((n) => !n.changed);
      const pos = new Map();
      positions = pos;
      [changed, context].forEach((group, col) =>
        group.forEach((n, i) => pos.set(n.id, [col * 770 + 40, i * 100 + 35]))
      );
      extent = [
        0,
        0,
        1280,
        Math.max(changed.length, context.length, 1) * 100 + 60,
      ];
      const scene = $("scene");
      scene.replaceChildren();
      for (const e of edges) {
        const [sx, sy] = pos.get(e.source),
          [tx, ty] = pos.get(e.target);
        let x1 = sx + 380,
          y1 = sy + 37,
          x2 = tx,
          y2 = ty + 37;
        let path;
        if (sx === tx) {
          x2 = tx + 380;
          const bend = x1 + 65 + Math.min(Math.abs(y2 - y1) * 0.12, 100);
          path = `M${x1},${y1} C${bend},${y1} ${bend},${y2} ${x2},${y2}`;
        } else if (sx > tx) {
          x1 = sx;
          x2 = tx + 380;
          path = `M${x1},${y1} C${x1 - 200},${y1} ${
            x2 + 200
          },${y2} ${x2},${y2}`;
        } else
          path = `M${x1},${y1} C${x1 + 180},${y1} ${
            x2 - 180
          },${y2} ${x2},${y2}`;
        const active = e.source === selected || e.target === selected;
        const p = el("path", {
          d: path,
          class: `edge ${active ? "selected" : ""} ${
            selected && !active ? "dim" : ""
          }`,
          "marker-end": "url(#arrow)",
        });
        const label = el(
          "text",
          {
            x: (x1 + x2) / 2 + (sx === tx ? 80 : 0),
            y: (y1 + y2) / 2 - 5,
            "text-anchor": "middle",
            class: `edge-label ${selected && !active ? "dim" : ""}`,
          },
          `${kinds(e)} ×${e.evidence.length}`
        );
        const title = el("title", {}, `${e.source} → ${e.target}\n${kinds(e)}`);
        p.append(title);
        const click = () => {
          $("detail-title").textContent = "Relacja między plikami";
          evidence([e], null);
        };
        p.onclick = click;
        label.onclick = click;
        scene.append(p, label);
      }
      for (const n of nodes) {
        const [x, y] = pos.get(n.id),
          g = el("g", {
            transform: `translate(${x},${y})`,
            class: `node ${n.changed ? "changed" : ""} ${
              n.status?.deleted ? "deleted" : ""
            } ${selected === n.id ? "selected" : ""}`,
            tabindex: 0,
            role: "button",
            "aria-label": n.id,
          });
        g.append(
          el("rect", { width: 380, height: 76, rx: 9 }),
          el("title", {}, `${n.id}\n${status(n)}`)
        );
        const chunks = n.id.match(/.{1,48}/gu) || [""];
        const label = el("text", { x: 12, y: 20 });
        chunks
          .slice(0, 2)
          .forEach((s, i) =>
            label.append(
              el(
                "tspan",
                { x: 12, dy: i ? 16 : 0 },
                s + (i === 1 && chunks.length > 2 ? "…" : "")
              )
            )
          );
        g.append(
          label,
          el("text", { x: 12, y: 63, class: "status" }, status(n).slice(0, 65))
        );
        g.onclick = () => select(n.id);
        g.onkeydown = (e) => {
          if (e.key === "Enter") select(n.id);
        };
        scene.append(g);
      }
      $("empty").textContent = nodes.length
        ? ""
        : "Brak zmienionych plików pasujących do filtra.";
      if (!box) fit();
    }
    $("search").oninput = draw;
    $("fit").onclick = fit;
    $("svg").addEventListener(
      "wheel",
      (e) => {
        e.preventDefault();
        if (!box) return;
        const r = $("svg").getBoundingClientRect(),
          px = (e.clientX - r.left) / r.width,
          py = (e.clientY - r.top) / r.height,
          k = e.deltaY > 0 ? 1.12 : 1 / 1.12;
        box = [
          box[0] + box[2] * px * (1 - k),
          box[1] + box[3] * py * (1 - k),
          box[2] * k,
          box[3] * k,
        ];
        view();
      },
      { passive: false }
    );
    $("svg").onpointerdown = (e) => {
      if (e.target.closest(".node") || e.target.closest(".edge") || !box)
        return;
      drag = [e.clientX, e.clientY, ...box];
      $("svg").setPointerCapture(e.pointerId);
    };
    $("svg").onpointermove = (e) => {
      if (!drag) return;
      box = [
        drag[2] - ((e.clientX - drag[0]) * drag[4]) / $("svg").clientWidth,
        drag[3] - ((e.clientY - drag[1]) * drag[5]) / $("svg").clientHeight,
        drag[4],
        drag[5],
      ];
      view();
    };
    $("svg").onpointerup = () => (drag = null);
    $("svg").onpointercancel = () => (drag = null);
    async function poll() {
      try {
        const response = await fetch("data", { cache: "no-store" });
        if (!response.ok) throw Error(`HTTP ${response.status}`);
        const s = await response.json();
        $("notice").textContent = s.error
          ? `Błąd odświeżania — poprzedni graf pozostaje widoczny.\n${s.error}`
          : s.busy
          ? "Analiza Graphify w tle…"
          : "";
        if (s.data && s.revision !== revision) {
          revision = s.revision;
          graph = s.data;
          $("root").textContent = graph.root;
          const changed = graph.nodes.filter((n) => n.changed);
          $("summary").textContent = `${changed.length} zmienionych · ${
            graph.nodes.length - changed.length
          } sąsiadów · ${graph.edges.length} relacji plików · ${
            graph.generated
          }`;
          draw();
          if (selected)
            evidence(
              graph.edges.filter(
                (e) => e.source === selected || e.target === selected
              )
            );
          followTerminalSelection(true);
        }
      } catch (e) {
        $(
          "notice"
        ).textContent = `Utracono połączenie: ${e.message}. Uruchom ponownie review . w terminalu.`;
      } finally {
        setTimeout(poll, 2000);
      }
    }
    async function pollSelection() {
      try {
        const response = await fetch("selection", {cache: "no-store"});
        if (response.ok) {
          terminalSelection = await response.json();
          followTerminalSelection();
        }
      } catch (_) {
        // The data poll displays connection errors; retain the current graph.
      } finally {
        setTimeout(pollSelection, 250);
      }
    }
    poll();
    pollSelection();
  </script>
</html>
