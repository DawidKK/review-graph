[build-system]
requires = ["uv_build>=0.8,<0.10"]
build-backend = "uv_build"

[project]
name = "review-graph"
version = "0.1.0"
description = "Local Graphify dependency graphs alongside Neovim Diffview reviews"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
review-graph = "review_graph.cli:main"
review-graph-install-neovim = "review_graph.install:install"
